<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>掌柜智库</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: rgba(30, 41, 59, 0.7);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --brand: #38bdf8;
            --brand2: #818cf8;
            --bubble-user: linear-gradient(135deg, #38bdf8, #818cf8);
            --bubble-bot: rgba(15, 23, 42, 0.6);
            --border: rgba(255, 255, 255, 0.1);
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, Arial, sans-serif;
            background-color: #0f172a;
            background-image: radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
            radial-gradient(circle at 85% 30%, rgba(129, 140, 248, 0.08) 0%, transparent 50%),
            linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px;
        }

        .app {
            width: 100%;
            max-width: 980px;
            height: min(820px, 92vh);
            position: relative;
            background: var(--panel);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.5);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 240px;
        }

        .logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--brand), var(--brand2));
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .title {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .title strong {
            font-size: 14px
        }

        .title span {
            font-size: 12px;
            color: var(--muted);
            margin-top: 3px
        }

        .top-actions {
            margin-left: auto;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .pill {
            font-size: 12px;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.6);
        }

        .btn {
            border: none;
            background: linear-gradient(135deg, var(--brand), var(--brand2));
            color: #fff;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed
        }

        .chat {
            flex: 1;
            overflow: auto;
            padding: 16px 14px 10px;
            background: rgba(15, 23, 42, 0.3);
        }

        .dayline {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            margin: 6px 0 14px;
        }

        .msg {
            display: flex;
            gap: 10px;
            margin: 10px 0;
            align-items: flex-end;
        }

        .msg.user {
            justify-content: flex-end
        }

        /* 关键：只让“消息内容容器”(排除头像)在 flex 中可伸缩，避免被压到“1 个字宽”导致竖排换行 */
        .msg > div:not(.avatar) {
            flex: 1;
            min-width: 0;
        }

        .msg.user > div:not(.avatar) {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: rgba(56, 189, 248, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #94a3b8;
            flex: 0 0 auto;
        }

        .avatar.bot {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(129, 140, 248, 0.2))
        }

        .bubble {
            max-width: min(720px, 76%);
            display: inline-block;
            border-radius: 14px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            background: var(--bubble-bot);
            position: relative;
            line-height: 1.55;
            font-size: 14px;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            color: #e2e8f0;
        }

        .msg.user .bubble {
            background: var(--bubble-user);
            color: #fff;
            border-color: transparent;
        }

        .meta {
            font-size: 11px;
            color: var(--muted);
            margin-top: 6px;
        }

        .msg.user .meta {
            color: rgba(255, 255, 255, .85)
        }

        details.progress {
            margin-top: 8px;
            border: 1px dashed rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 8px 10px;
            background: rgba(15, 23, 42, 0.4);
        }

        details.progress summary {
            cursor: pointer;
            user-select: none;
            color: var(--muted);
            font-size: 12px;
        }

        .progress ul {
            margin: 8px 0 0 18px;
            padding: 0
        }

        .progress li {
            margin: 4px 0;
            font-size: 12px;
            color: #94a3b8
        }

        .answer-images {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .answer-images img {
            display: block;
            max-width: min(100%, 600px);
            max-height: 600px;
            width: auto;
            height: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
            background: rgba(15, 23, 42, 0.6);
        }

        .answer-images a {
            font-size: 12px;
            color: var(--muted);
            text-decoration: none;
            word-break: break-all;
        }

        /* 答案正文：保留换行。后端会把【参考来源】区块拼在答案末尾，
           原来是 textContent 直出、换行被折叠成一行，引用信息挤成一条长线。 */
        .answer-text {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.7;
        }

        .typing {
            display: inline-flex;
            gap: 6px;
            align-items: center;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #38bdf8;
            animation: bounce 1.2s infinite ease-in-out;
        }

        .dot:nth-child(2) {
            animation-delay: .15s
        }

        .dot:nth-child(3) {
            animation-delay: .3s
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: translateY(0);
                opacity: .6
            }
            40% {
                transform: translateY(-5px);
                opacity: 1
            }
        }

        .composer {
            border-top: 1px solid var(--border);
            padding: 12px 14px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: rgba(15, 23, 42, 0.5);
        }

        textarea {
            flex: 1;
            resize: none;
            min-height: 44px;
            max-height: 140px;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            outline: none;
            font-size: 14px;
            line-height: 1.5;
            background: rgba(15, 23, 42, 0.6);
            color: #e2e8f0;
        }

        textarea:focus {
            border-color: rgba(56, 189, 248, 0.6);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15)
        }

        textarea::placeholder {
            color: #64748b
        }

        .send {
            width: 88px;
            height: 44px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            color: #fff;
            background: linear-gradient(135deg, var(--brand), var(--brand2));
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .send:disabled {
            opacity: .6;
            cursor: not-allowed
        }

        .hint {
            padding: 0 14px 12px;
            color: var(--muted);
            font-size: 12px;
            background: transparent;
        }

        .kbd {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            border: 1px solid var(--border);
            padding: 1px 6px;
            border-radius: 6px;
            background: rgba(15, 23, 42, 0.6);
            color: #94a3b8;
        }

        /* 用户向上翻看历史时出现的“回到底部”按钮 */
        .jump-bottom {
            position: absolute;
            right: 18px;
            bottom: 104px;
            z-index: 20;
            display: none;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
            font-size: 12px;
            color: #e2e8f0;
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid var(--border);
            border-radius: 999px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            transition: opacity .15s ease, transform .15s ease;
        }

        .jump-bottom.show {
            display: inline-flex;
        }

        .jump-bottom:hover {
            transform: translateY(-1px);
            border-color: var(--brand);
        }

        .jump-bottom .arrow {
            font-size: 13px;
            line-height: 1;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="topbar">
        <div class="brand">
            <div class="logo">
                <svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2.5" y="4" width="19" height="16" rx="3" fill="white"/>
                    <circle cx="12" cy="1.8" r="1.4" fill="white"/>
                    <rect x="11.6" y="1.8" width="0.8" height="2.2" fill="white"/>
                    <circle cx="8" cy="10" r="1.3" fill="#38bdf8"/>
                    <circle cx="16" cy="10" r="1.3" fill="#38bdf8"/>
                    <rect x="7.2" y="14.2" width="9.6" height="1.6" rx="0.8" fill="#38bdf8"/>
                </svg>
            </div>
            <div class="title">
                <strong>掌柜智库</strong>
                <span id="subTitle">在线 · 可查询知识库与联网信息</span>
            </div>
        </div>
        <div class="top-actions">
            <span class="pill" id="apiPill">API: 未连接</span>
            <button class="btn" id="btnClear">清空对话</button>
        </div>
    </div>

    <div class="chat" id="chat">
        <div class="dayline">今天</div>
        <div class="msg bot">
            <div class="avatar bot">🤖</div>
            <div>
                <div class="bubble">你好，我是掌柜智库客服。你可以直接提问，我会在“阶段进度”里展示处理过程。</div>
                <div class="meta">提示：可以问“如何使用万用表测量电压？”</div>
            </div>
        </div>
    </div>

    <button class="jump-bottom" id="jumpBottom" type="button">
        <span class="arrow">↓</span><span>回到最新</span>
    </button>

    <div class="composer">
        <textarea id="input" placeholder="请输入问题（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="send" id="send">发送</button>
    </div>
    <div class="hint">快捷键：<span class="kbd">Enter</span> 发送，<span class="kbd">Shift</span>+<span
            class="kbd">Enter</span> 换行
    </div>
</div>

<script>

    // 默认同源；如你把页面单独打开（file://），可改成 http://127.0.0.1:8001
    // const API_BASE = `${location.protocol}//${location.host}`.includes('http') ? `${location.protocol}//${location.host}` : 'http://127.0.0.1:8001';
    const API_BASE = 'http://127.0.0.1:8001'
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const btnClear = document.getElementById('btnClear');
    const apiPill = document.getElementById('apiPill');
    const jumpBottomEl = document.getElementById('jumpBottom');

    // 创建会话: 从localStorage获取sessionId
    // debugger
    let sessionId = localStorage.getItem('kb_session_id');
    // 不存在则创建
    if (!sessionId) {
        sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        //存入localStorage
        localStorage.setItem('kb_session_id', sessionId);
    }

    // ===== 滚动吸底逻辑 =====
    // 原实现：每次收到 delta 都无条件执行 scrollTop = scrollHeight。
    // 流式输出时几十毫秒就触发一次，用户手动上滑的视口会被立刻拽回底部，
    // 导致历史消息完全无法翻阅。改为“智能跟随”：
    //   1) 只在用户本来就在底部时才自动跟随新内容；
    //   2) 用户上滑后停止跟随，并显示“回到最新”按钮；
    //   3) 用 requestAnimationFrame 合并高频调用，避免每个 token 触发一次强制布局。
    const STICK_THRESHOLD = 80;   // 距底部多少像素以内算“在底部”
    let stickToBottom = true;     // 是否跟随最新内容
    let scrollRafId = null;

    function isNearBottom() {
        return chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight <= STICK_THRESHOLD;
    }

    function setJumpBtnVisible(visible) {
        if (!jumpBottomEl) return;
        jumpBottomEl.classList.toggle('show', !!visible);
    }

    // force=true 用于“用户主动发起”的场景（发消息、加载历史、清空对话）
    function scrollToBottom(force = false) {
        if (!force && !stickToBottom) return;
        stickToBottom = true;
        chatEl.scrollTop = chatEl.scrollHeight;
        setJumpBtnVisible(false);
    }

    // 高频入口：一帧内只执行一次
    function scheduleScrollToBottom() {
        if (scrollRafId !== null) return;
        scrollRafId = requestAnimationFrame(() => {
            scrollRafId = null;
            scrollToBottom();
        });
    }

    // 由滚动事件反推用户意图：确实离开底部才关闭跟随
    chatEl.addEventListener('scroll', () => {
        stickToBottom = isNearBottom();
        setJumpBtnVisible(!stickToBottom);
    }, {passive: true});

    if (jumpBottomEl) {
        jumpBottomEl.addEventListener('click', () => scrollToBottom(true));
    }

    function nowTime() {
        const d = new Date();
        return d.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
    }

    function formatTime(ts) {
        if (!ts) return nowTime();
        const d = new Date(Number(ts) * 1000);
        if (Number.isNaN(d.getTime())) return nowTime();
        return d.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
    }

    function escapeHtml(str) {
        return String(str)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", "&#039;");
    }

    function isImageUrl(url) {
        // 增加宽松度，有些 url 可能后面跟了奇怪的参数
        // 只要包含 .jpg .png 等扩展名，且后面是 ? # 或 结束，或者被某些标点截断前
        // 简单判断：路径部分以图片后缀结尾
        try {
            const u = new URL(url);
            return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
        } catch (e) {
            // 如果 new URL 失败（比如相对路径或非法字符），退回正则匹配
            return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
        }
    }

    function normalizeUrl(rawUrl) {
        const s = String(rawUrl || '').trim();
        if (!s) return '';
        // 尽量保留原始 URL，但把空格编码，避免 img src 失败
        return s.replace(/\s/g, '%20');
    }

    function dedupeKeepOrder(arr) {
        const seen = new Set();
        const out = [];
        for (const x of (Array.isArray(arr) ? arr : [])) {
            const v = String(x || '');
            if (!v) continue;
            if (seen.has(v)) continue;
            seen.add(v);
            out.push(v);
        }
        return out;
    }

    function extractUrlsLoose(text) {
        const s = String(text || '');
        // 简单正则提取：匹配 http/https 开头，直到遇到空白字符
        // [^\s] 包含中文、特殊符号等，直到遇到换行或空格
        const regex = /(https?:\/\/[^\s]+)/g;
        const matches = s.match(regex) || [];
        const urls = [];

        // 去除首尾标点
        const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
        const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');

        for (const m of matches) {
            let u = trimHeadPunct(trimTailPunct(m));
            // 简单清洗可能混入的结尾
            if (u) urls.push(u);
        }
        return dedupeKeepOrder(urls);
    }

    function findLastImageMarkerIndex(raw) {
        const s = String(raw || '');
        // 支持多种写法：【图片】、【 图片 】、[图片]、[ 图片 ]
        const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
        let m;
        let lastIdx = -1;
        let lastLen = 0;
        while ((m = re.exec(s)) !== null) {
            lastIdx = m.index;
            lastLen = m[0].length;
        }
        return {idx: lastIdx, len: lastLen};
    }

    function parseAnswerAndImages(text) {
        const raw = String(text || '');
        const {idx, len} = findLastImageMarkerIndex(raw);
        if (idx === -1) return {text: raw, images: []};

        const before = raw.slice(0, idx).trimEnd();
        const after = raw.slice(idx + len).trim();
        const urls = [];

        // 优先按“每行一个 URL”的方式解析，允许 URL 中包含空格
        const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        for (const line of lines) {
            if (line.startsWith('http://') || line.startsWith('https://')) {
                urls.push(line);
            } else {
                // 兼容同一行包含多个 URL 的情况
                const matches = extractUrlsLoose(line);
                for (const u of matches) {
                    urls.push(u);
                }
            }
        }

        // 去重保序 + 过滤图片链接
        const seen = new Set();
        const images = [];
        for (const u of urls) {
            const normalized = normalizeUrl(u);
            if (!isImageUrl(normalized)) continue;
            if (seen.has(normalized)) continue;
            seen.add(normalized);
            images.push(normalized);
        }
        return {text: before, images};
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls) {
        const {text, images: imagesFromBlock} = parseAnswerAndImages(answerText);
        const candidates = Array.isArray(candidateImageUrls)
            ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl)
            : [];
        const hasBlockImages = imagesFromBlock && imagesFromBlock.length > 0;

        // 使用宽松提取
        const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);

        // 只要后端给了候选图片，就展示（避免答案没写“如图”但用户仍需要看图）
        // 或者从文本里提取到了图片 URL
        const shouldShow = hasBlockImages || (candidates.length > 0) || (looseImages.length > 0);

        // 优先级：Block 显式标记 > 后端候选 > 文本宽松提取
        // 注意：这里做个并集可能更好，防止漏掉
        const allImages = new Set([
            ...(hasBlockImages ? imagesFromBlock : []),
            ...candidates,
            ...looseImages
        ]);
        const images = Array.from(allImages);

        containerEl.textContent = '';

        if ((text || '').trim().length > 0) {
            const textEl = document.createElement('div');
            textEl.className = 'answer-text';
            textEl.textContent = text;
            containerEl.appendChild(textEl);
        } else {
            const textEl = document.createElement('div');
            textEl.className = 'answer-text';
            textEl.textContent = '（已完成，但未返回答案）';
            containerEl.appendChild(textEl);
        }

        if (images && images.length > 0) {
            const imgWrap = document.createElement('div');
            imgWrap.className = 'answer-images';
            for (const url of images) {
                const safeUrl = normalizeUrl(url);
                const img = document.createElement('img');
                img.loading = 'lazy';
                img.src = safeUrl;
                img.alt = '参考图片';
                img.referrerPolicy = 'no-referrer';
                img.addEventListener('error', () => {
                    img.style.display = 'none';
                });
                // 图片解码后高度会变化，若用户仍在底部则继续跟随
                img.addEventListener('load', () => scheduleScrollToBottom());
                imgWrap.appendChild(img);

                const link = document.createElement('a');
                link.href = safeUrl;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = url;
                imgWrap.appendChild(link);
            }
            containerEl.appendChild(imgWrap);
        }
    }

    function addUserMsg(text) {
        const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${nowTime()}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        scrollToBottom(true);
    }

    function addUserMsgWithTime(text, ts) {
        const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        scrollToBottom(true);
    }

    function addBotMsgWithTime(text, ts, imageUrls) {
        const id = 'bot-his-' + Math.random().toString(36).slice(2);
        const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">🤖</div>
          <div>
            <div class="bubble"><div class="answer"></div></div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        const el = document.getElementById(id);
        if (el) {
            const answerEl = el.querySelector('.answer');
            renderAnswerWithImages(answerEl, text || '', imageUrls || []);
        }
        scrollToBottom(true);
    }

    function addBotMsgSkeleton() {
        const id = 'bot-' + Math.random().toString(36).slice(2);
        const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">🤖</div>
          <div style="min-width: 180px;">
            <div class="bubble">
              <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
              <details class="progress" open>
                <summary>阶段进度（等待中）</summary>
                <ul></ul>
              </details>
            </div>
            <div class="meta">${nowTime()}</div>
          </div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        scrollToBottom(true);
        return document.getElementById(id);
    }

    function renderProgress(botMsgEl, doneList, runningList, status) {
        const details = botMsgEl.querySelector('details.progress');
        const summary = details.querySelector('summary');
        const ul = details.querySelector('ul');
        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];
        const totalDone = done.length;
        const totalRun = running.length;

        const statusMap = {
            'processing': '处理中',
            'completed': '已完成',
            'failed': '失败',
            'pending': '等待中',
        };
        const displayStatus = statusMap[status] || status || 'unknown';

        summary.textContent = `阶段进度（已完成${totalDone}，进行中${totalRun}，状态：${displayStatus}）`;

        const lines = [
            ...done.map(x => `✅ ${x}`),
            ...running.map(x => `⏳ ${x}`)
        ];
        ul.innerHTML = '';
        if (lines.length === 0) {
            ul.insertAdjacentHTML('beforeend', '<li>暂无进度</li>');
        } else {
            for (const line of lines) {
                ul.insertAdjacentHTML('beforeend', `<li>${escapeHtml(line)}</li>`);
            }
        }
    }

    async function apiHealth(){
      try{
        const res = await fetch(`${API_BASE}/health`);
        if(!res.ok) throw new Error('health not ok');
        apiPill.textContent = `API: 已连接`;
      }catch(e){
        apiPill.textContent = `API: 未连接`;
      }
    }

    async function loadHistory() {
        try {
            const res = await fetch(`${API_BASE}/history/${sessionId}`);
            if (!res.ok) return;
            const data = await res.json();
            const items = Array.isArray(data.items) ? data.items : [];// items才是历史记录
            if (items.length === 0) return;
            // 保留首条欢迎消息，其余先清空再渲染历史
            const nodes = Array.from(chatEl.querySelectorAll('.msg'));
            for (let i = 1; i < nodes.length; i++) nodes[i].remove();
            for (const item of items) {
                if (item.role === 'user') {
                    addUserMsgWithTime(item.text || '', item.ts);
                } else {
                    addBotMsgWithTime(item.text || '', item.ts, item.image_urls || []);
                }
            }
            scrollToBottom(true);
        } catch (_) {
        }
    }

    async function submitQuery(text) {
        const res = await fetch(`${API_BASE}/query`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                query: text,
                session_id: sessionId
            })
        });
        if (!res.ok) {
            const msg = await res.text();
            throw new Error(msg || '请求失败');
        }
        return await res.json();
    }

    async function onSend() {
        const text = (inputEl.value || '').trim();
        if (!text) return;
        inputEl.value = '';
        addUserMsg(text);
        const botMsgEl = addBotMsgSkeleton();
        sendBtn.disabled = true;

        try {
            const data = await submitQuery(text);

            // 渲染初始状态
            renderProgress(botMsgEl, [], [], 'pending');

            // 流式：SSE
            // 类似python的解包，前端叫解构赋值   {task_id:100}
            // const task_id = data.task_id
            const {task_id} = data;

            const bubble = botMsgEl.querySelector('.bubble');
            let answerEl = bubble.querySelector('.answer');
            if (!answerEl) {
                answerEl = document.createElement('div');
                answerEl.className = 'answer';
                bubble.insertBefore(answerEl, bubble.firstChild);
            }

            const es = new EventSource(`${API_BASE}/stream/${task_id}`);
            let rawAnswerText = '';

            es.addEventListener('progress', (e) => {
                try {
                    const d = JSON.parse(e.data || '{}');
                    renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
                    // 当进度状态已完成时，提前结束“...”等待态
                    if (d && d.status === 'completed') {
                        const typing = botMsgEl.querySelector('.typing');
                        if (typing) typing.remove();
                        // 防止后端未发送 final 导致按钮一直禁用
                        sendBtn.disabled = false;
                    }
                    // 进度列表高度会变化，保持在底部时继续跟随
                    scheduleScrollToBottom();
                } catch (_) {
                }
            });

            es.addEventListener('delta', (e) => {
                try {
                    const d = JSON.parse(e.data || '{}');
                    const delta = d.delta || '';
                    if (delta) {
                        rawAnswerText += delta;
                        // 即使后端未发送 final，也尽可能在流式过程中渲染图片
                        renderAnswerWithImages(answerEl, rawAnswerText, []);
                        scheduleScrollToBottom();
                    }
                } catch (_) {
                }
            });

            es.addEventListener('final', (e) => {

                const typing = botMsgEl.querySelector('.typing');
                if (typing) typing.remove();

                // ★ 关键修复：强制把所有"进行中 ⏳"的节点标记为"已完成 ✅"
                // 原因：最后一条 progress 事件可能还没到就被 final 抢先了，
                // 导致"生成答案"等节点永远卡在 ⏳ 状态不变绿
                const details = botMsgEl.querySelector('details.progress');
                if (details) {
                    const ul = details.querySelector('ul');
                    if (ul) {
                        const lis = ul.querySelectorAll('li');
                        lis.forEach(li => {
                            if (li.textContent.includes('⏳')) {
                                li.textContent = li.textContent.replace('⏳', '✅');
                            }
                        });
                    }
                    // 更新 summary：全部完成
                    const summary = details.querySelector('summary');
                    if (summary) {
                        const totalDone = details.querySelectorAll('li').length;
                        summary.textContent = `阶段进度（已完成${totalDone}，进行中0，状态：已完成）`;
                    }
                    // 收起进度条
                    details.removeAttribute('open');
                }

                try {
                    const d = JSON.parse(e.data || '{}');
                    // 优先使用 final 包里的完整 answer，否则回退到流式拼接的文本
                    const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
                    renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
                } catch (_) {
                }
                scheduleScrollToBottom();
                es.close();
                sendBtn.disabled = false;
            });

            es.addEventListener('error', (e) => {
                const typing = botMsgEl.querySelector('.typing');
                if (typing) typing.remove();
                // 收起进度条
                const progress = botMsgEl.querySelector('details.progress');
                if (progress) progress.removeAttribute('open');

                try {
                    const msg = e && e.data ? (JSON.parse(e.data).error || 'SSE 连接中断/失败') : 'SSE 连接中断/失败';
                    rawAnswerText += `\n\n（错误：${msg}）`;
                    renderAnswerWithImages(answerEl, rawAnswerText, []);
                } catch (_) {
                    rawAnswerText += `\n\n（错误：SSE 连接中断/失败）`;
                    renderAnswerWithImages(answerEl, rawAnswerText, []);
                }
                scheduleScrollToBottom();
                es.close();
                sendBtn.disabled = false;
            });
        } catch (e) {
            const bubble = botMsgEl.querySelector('.bubble');
            const progress = botMsgEl.querySelector('details.progress');
            const typing = botMsgEl.querySelector('.typing');
            if (typing) typing.remove();
            bubble.innerHTML = `请求失败：${escapeHtml(e.message || e)}\n\n` + progress.outerHTML;
            sendBtn.disabled = false;
        }
    }

    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            onSend();
        }
    });
    btnClear.addEventListener('click', async () => {
        if (!confirm('确定要清空当前会话的历史记录吗？这将无法恢复。')) return;

        try {
            const res = await fetch(`${API_BASE}/history/${sessionId}`, {method: 'DELETE'});
            if (!res.ok) {
                console.error("Failed to clear history backend, status:", res.status);
                alert('服务端清空失败，仅清空本地显示');
            }
        } catch (e) {
            console.error("Failed to clear history backend", e);
            alert('服务端清空失败，仅清空本地显示');
        }

        // 清空除首条欢迎消息外的内容
        const nodes = Array.from(chatEl.querySelectorAll('.msg'));
        for (let i = 1; i < nodes.length; i++) nodes[i].remove();
        scrollToBottom(true);
    });

    apiHealth();
    loadHistory();
    setTimeout(() => inputEl.focus(), 200);
</script>
</body>
</html>
